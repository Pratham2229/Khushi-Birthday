<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Khushi • 22</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#08080d;color:#f7f3ec;font-family:Arial,Helvetica,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#app{position:fixed;inset:0;text-align:center}
.hidden{display:none!important}
.header{position:absolute;top:5%;left:0;right:0}
.date{font-size:11px;letter-spacing:4px;color:#c9a55c;font-weight:bold}
.name{font:42px Georgia,serif;letter-spacing:5px;margin-top:22px}
.rule{width:140px;height:1px;background:#8a6d3a;margin:14px auto}
.sub{font-size:12px;color:#7a737a}
.question{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,700px)}
.question h1{font:30px Georgia,serif;font-weight:normal;margin:25px 0}
.question p{font-size:12px;color:#7a737a}
.qrule{width:240px;height:1px;background:#8a6d3a;margin:0 auto}
.buttons{display:flex;justify-content:center;gap:20px;margin-top:65px}
button{border:0;border-radius:3px;padding:14px 38px;font-weight:bold;cursor:pointer;letter-spacing:1px}
#yes{background:#c7a45f;color:#111015}#yes:hover{background:#e2c584}
#no{background:#3a3238;color:#d9d0c7}
#scene{position:absolute;inset:0}
#cake{position:absolute;width:min(520px,82vw);height:420px;left:50%;top:54%;transform:translate(-50%,-50%);animation:drop 2.4s cubic-bezier(.16,.72,.25,1) forwards}
@keyframes drop{from{top:-30%}to{top:54%}}
.tier{position:absolute;left:50%;transform:translateX(-50%);background:#f9f6f1;border:1px solid #e5ddd2;box-shadow:0 14px 25px #0005}
.t1{width:90%;height:95px;bottom:40px}.t2{width:67%;height:85px;bottom:135px}.t3{width:43%;height:70px;bottom:220px}
.cream{position:absolute;left:50%;transform:translateX(-50%);height:22px;border-radius:50%;background:#f0ebe4}
.c1{width:90%;bottom:116px}.c2{width:67%;bottom:211px}.c3{width:43%;bottom:290px}
.ribbon{position:absolute;background:#1c1c1c;height:4px;transform:rotate(-9deg)}
.r1{width:110px;left:24%;bottom:150px}.r2{width:110px;right:24%;bottom:150px}
.bow{position:absolute;width:38px;height:25px;background:#1c1c1c;border-radius:50%;bottom:150px}
.bow:before,.bow:after{content:"";position:absolute;width:30px;height:24px;background:#1c1c1c;border-radius:50%;top:0}
.bow:before{right:20px}.bow:after{left:20px}.b1{left:23%}.b2{right:23%}.b3{left:50%;transform:translateX(-50%);bottom:70px}
.crown{position:absolute;left:50%;bottom:290px;transform:translateX(-50%);color:#c9a55c;font-size:40px}
.candle{position:absolute;left:50%;bottom:350px;transform:translateX(-50%);width:13px;height:52px;background:#f5f0e6;border:1px solid #d4c4a8;border-radius:3px}
.flame{position:absolute;left:50%;bottom:402px;transform:translateX(-50%);width:24px;height:39px;background:#e8b84a;border-radius:55% 45% 55% 45%;box-shadow:0 0 30px #e8b84a88;animation:flicker .12s infinite alternate}
@keyframes flicker{to{transform:translateX(-50%) rotate(-5deg) scale(.9,.96)}}
#controls{position:absolute;bottom:6%;left:0;right:0;color:#7a737a;font-size:13px}
#blow{margin-top:15px;background:#c7a45f;color:#111015}
#final{position:absolute;inset:7% 8%;border:1px solid #4a3a2c;background:#09090edd;padding:35px 8%;overflow:auto}
#final:after{content:"";position:absolute;inset:12px;border:1px solid #252028;pointer-events:none}
.final-content{position:relative;z-index:2;max-width:850px;margin:auto}
.one{font-size:10px;font-weight:bold;letter-spacing:3px;color:#c9a55c}
.final-content h2{font:32px Georgia,serif;font-weight:normal;margin:24px 0 8px}
.age{color:#e8d5a3;font-size:11px;letter-spacing:2px}
.roman{font:28px Georgia,serif;color:#d9a8b2;margin:24px 0 8px}
.message{font-size:12px;line-height:1.65;color:#efe9e0}
.message div{min-height:1em}
.signature{font:italic 14px Georgia,serif;color:#e8d5a3;margin-top:28px}
@media(max-height:650px){.header{top:2%}.name{font-size:32px;margin-top:8px}#cake{transform:translate(-50%,-50%) scale(.72)}#controls{bottom:2%}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
  <section id="question" class="question">
    <div class="qrule"></div>
    <h1>Do you really love me?</h1>
    <p>Choose carefully…</p>
    <div class="qrule" style="width:160px"></div>
    <div class="buttons"><button id="yes">YES</button><button id="no">NO</button></div>
  </section>

  <section id="scene" class="hidden">
    <div class="header">
      <div class="date">22 • 10 • 2026</div>
      <div class="name">KHUSHI</div>
      <div class="rule"></div>
      <div class="sub">A little something, made especially for you.</div>
    </div>
    <div id="cake">
      <div class="tier t1"></div><div class="tier t2"></div><div class="tier t3"></div>
      <div class="cream c1"></div><div class="cream c2"></div><div class="cream c3"></div>
      <div class="ribbon r1"></div><div class="ribbon r2"></div>
      <div class="bow b1"></div><div class="bow b2"></div><div class="bow b3"></div>
      <div class="crown">♛</div>
      <div class="candle"></div><div id="flame" class="flame"></div>
    </div>
    <div id="controls">Close your eyes. Make a wish.<br><button id="blow">BLOW OUT THE CANDLE</button></div>
  </section>

  <section id="final" class="hidden">
    <div class="final-content">
      <div class="one">ONE YEAR OF US</div>
      <h2>HAPPY BIRTHDAY, KHUSHI</h2>
      <div class="age">22 OCTOBER 2026</div>
      <div class="roman">XXII</div>
      <div class="rule"></div>
      <div id="message" class="message"></div>
      <div class="signature">With all my love baby ♥</div>
    </div>
  </section>
</div>

<script>
const c=document.getElementById('fx'),x=c.getContext('2d');
let W,H,dpr,stars=[],fireworks=[],hearts=[],celebrated=false;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
for(let i=0;i<140;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.3,p:Math.random()*7});
function burst(px,py,n=60){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=2+Math.random()*6;fireworks.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35+Math.random()*40})}}
function loop(){
 x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#08080d');g.addColorStop(1,'#120e14');x.fillStyle=g;x.fillRect(0,0,W,H);
 stars.forEach(s=>{x.globalAlpha=.2+.5*(Math.sin(Date.now()*.001+s.p)+1)/2;x.fillStyle='#b9aa92';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});x.globalAlpha=1;
 fireworks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.vx*=.992;p.life--;x.globalAlpha=Math.max(0,p.life/55);x.fillStyle=Math.random()>.5?'#e8d5a3':'#d9a8b2';x.beginPath();x.arc(p.x,p.y,1.7,0,7);x.fill()});fireworks=fireworks.filter(p=>p.life>0);x.globalAlpha=1;
 hearts.forEach(h=>{h.y-=h.v;h.x+=h.d;x.globalAlpha=.55;x.fillStyle='#d9a8b2';x.font='18px Georgia';x.fillText('♥',h.x,h.y)});hearts=hearts.filter(h=>h.y>-30);x.globalAlpha=1;
 if(celebrated){if(Math.random()<.055)burst(100+Math.random()*(W-200),100+Math.random()*H*.45,45);if(Math.random()<.025)hearts.push({x:Math.random()*W,y:H+20,v:.5+Math.random(),d:(Math.random()-.5)*.3})}
 requestAnimationFrame(loop)
}loop();

const lines=["Khushi,","","Today is your 22nd birthday,","but 22 October means something even more beautiful to me.","","It is one year of us.","One year of conversations, laughter, little moments,","memories, care, and a thousand reasons to smile.","","Thank you for becoming such a beautiful part of my life.","You made ordinary days feel a little more special.","","I hope 22 brings you happiness, peace, success,","and every little thing your heart wishes for.","","And I hope this is only the beginning","of many more birthdays, memories and chapters together.","","Happy Birthday, my love.","Happy 1st Anniversary to us. ♥"];
function type(i=0){
 if(i>=lines.length)return;
 let d=document.createElement('div');d.style.color=(i===0||i>=19)?'#e8d5a3':'#efe9e0';document.getElementById('message').appendChild(d);
 if(!lines[i]){d.style.height='8px';return setTimeout(()=>type(i+1),100)}
 let j=0;function go(){d.textContent=lines[i].slice(0,j++);if(j<=lines[i].length)setTimeout(go,i>=19?30:16);else setTimeout(()=>type(i+1),140)}go()
}
function showFinal(){document.getElementById('scene').classList.add('hidden');document.getElementById('final').classList.remove('hidden');type()}
function celebrate(){if(celebrated)return;celebrated=true;document.getElementById('flame').classList.add('hidden');document.getElementById('controls').classList.add('hidden');burst(W*.16,H*.32);burst(W*.84,H*.32);burst(W*.5,H*.18);burst(W*.2,H*.6);burst(W*.8,H*.6);setTimeout(showFinal,1200)}
document.getElementById('yes').onclick=()=>{document.getElementById('question').classList.add('hidden');document.getElementById('scene').classList.remove('hidden')};
const no=document.getElementById('no');
function runAway(){no.style.position='fixed';no.style.left=(Math.random()*(W-140))+'px';no.style.top=(Math.random()*(H-80))+'px'}
no.onmouseenter=runAway;no.onclick=runAway;
document.getElementById('blow').onclick=celebrate;
</script>
</body>
</html>
